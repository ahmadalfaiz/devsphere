<!DOCTYPE html>
<html lang="en">
  <head>

    <!-- Basic -->
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      http-equiv="X-UA-Compatible"
      content="IE=edge"
    />

    <!-- Default SEO -->
    <title>DevSphere</title>

    <meta
      name="title"
      content="DevSphere"
    />

    <meta
      name="description"
      content="DevSphere is a free platform to learn web development, programming, backend development, frontend development, interview preparation, projects, and software engineering through comprehensive tutorials."
    />

    <meta
      name="keywords"
      content="Programming Tutorials, HTML Tutorial, CSS Tutorial, React Tutorial, Node.js Tutorial, Express.js Tutorial, JavaScript Tutorial, Web Development, Backend Development, Frontend Development"
    />

    <meta
      name="author"
      content="DevSphere"
    />

    <meta
      name="robots"
      content="index, follow"
    />

    <meta
      name="googlebot"
      content="index, follow"
    />

    <meta
      name="language"
      content="English"
    />

    <meta
      name="revisit-after"
      content="7 days"
    />

    <meta
      name="rating"
      content="General"
    />

    <!-- Canonical -->

    <link
      rel="canonical"
      href="https://devspherehq.com/"
    />

    <!-- Open Graph -->

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:site_name"
      content="DevSphere"
    />

    <meta
      property="og:title"
      content="DevSphere"
    />

    <meta
      property="og:description"
      content="Learn programming, web development, backend development, frontend development, software engineering, interview preparation and real-world projects for free."
    />

    <meta
      property="og:url"
      content="https://devspherehq.com/"
    />

    <meta
      property="og:image"
      content="https://devspherehq.com/images/og-image.png"
    />

    <!-- Twitter -->

    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="DevSphere"
    />

    <meta
      name="twitter:description"
      content="Learn programming, web development, backend development, frontend development, software engineering and real-world projects."
    />

    <meta
      name="twitter:image"
      content="https://devspherehq.com/images/og-image.png"
    />

    <meta
      name="theme-color"
      content="#00D084"
    />
  </head>

  <body>

    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>

  </body>
